name: Build Gmail-infinity to EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install chromium

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --console `
          --add-data "config;config" `
          --add-data "core;core" `
          --add-data "creators;creators" `
          --add-data "identity;identity" `
          --add-data "verification;verification" `
          --add-data "warming;warming" `
          --add-data "api;api" `
          --hidden-import yaml `
          --hidden-import selenium `
          --hidden-import selenium.webdriver `
          --hidden-import selenium.webdriver.chrome.service `
          --hidden-import selenium_stealth `
          --hidden-import undetected_chromedriver `
          --hidden-import fake_useragent `
          --hidden-import user_agents `
          --hidden-import playwright `
          --hidden-import playwright.sync_api `
          --hidden-import playwright.async_api `
          --hidden-import playwright._impl._driver `
          --hidden-import requests `
          --hidden-import aiohttp `
          --hidden-import aiohttp_socks `
          --hidden-import httpx `
          --hidden-import httpx_socks `
          --hidden-import cloudscraper `
          --hidden-import socks `
          --hidden-import stem `
          --hidden-import PIL `
          --hidden-import PIL.Image `
          --hidden-import cv2 `
          --hidden-import numpy `
          --hidden-import scipy `
          --hidden-import cryptography `
          --hidden-import Crypto `
          --hidden-import faker `
          --hidden-import mimesis `
          --hidden-import fastapi `
          --hidden-import uvicorn `
          --hidden-import pydantic `
          --hidden-import pydantic_settings `
          --hidden-import websockets `
          --hidden-import aiofiles `
          --hidden-import rich `
          --hidden-import streamlit `
          --hidden-import loguru `
          --hidden-import tqdm `
          --hidden-import colorama `
          --hidden-import dotenv `
          --hidden-import jsonschema `
          --hidden-import orjson `
          --hidden-import keyring `
          --hidden-import apscheduler `
          --hidden-import schedule `
          --hidden-import psutil `
          --hidden-import tenacity `
          --hidden-import speech_recognition `
          --hidden-import pydub `
          --hidden-import gtts `
          --hidden-import jinja2 `
          --hidden-import multipart `
          --hidden-import asyncio `
          --hidden-import threading `
          --hidden-import json `
          --clean `
          --name=GmailInfinity `
          main.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: GmailInfinity-${{ github.sha }}
        path: dist/GmailInfinity.exe
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GmailInfinity.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
